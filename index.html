<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="desing.css">
    <title>Gerenciador de Jogos</title>
</head>

<body>
    <div class="borda_inteira">
        <img src="logo 2.png" alt="10px" width="30%">
    </div>
    <h1>GERENCIADOR DE JOGOS</h1>
    <br>
        <div class="criarjogos"><button onclick="criarjogos()">Adicionar jogo</button></div>
    </div>
    <div class="buscarjogos">
        <button onclick="buscarjogos()">Buscar jogo pelo nome</button>
    </div>
    <div class="removerjogos">
        <button onclick="removerjogos()">Deletar o jogo por id</button>
    </div>
        <div class="listarjogos">
            <button onclick="listarjogos()">Listar jogos</button>
        </div>
        
        <div class="removerultimo">
        <button onclick="removerultimo()">Remover ultimo jogo</button>
        </div>
        <div class="limpartudo">
        <button onclick="limpartudo()">Limpar tudo</button>
        </div>
        <div class="quantidadejogos">
        <button onclick="quantidadejogos()">Quantidade de jogos</button>
        </div>
        <hr>
     <p>© 2026 ✦    PixelVault  ✦ Todos os direitos reservados.
</p>

</body>
<script src="script.js"></script>

</html>
